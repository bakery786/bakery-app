<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b8234f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://ntfy.sh; frame-src https://*.firebaseapp.com https://*.web.app; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Bakery Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login" class="login">
  <form id="lf" class="card">
    <h2>Bakery Manager</h2>
    <p class="muted">Sign in with the account created in Firebase.</p>
    <label class="f"><span>Email</span><input name="email" type="email" required autocomplete="username"></label>
    <label class="f"><span>Password</span><input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn pri block" type="submit">Sign in</button>
    <p id="lerr" class="neg"></p>
  </form>
</section>
<div id="main" hidden>
  <header class="top"><div><b id="shopname">Bakery</b><small><span class="dot"></span>live</small></div></header>
  <nav id="tabs" class="tabs"></nav>
  <main id="view"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
